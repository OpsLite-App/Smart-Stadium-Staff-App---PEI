version: '3.8'
services:
  mosquitto:
    image: eclipse-mosquitto:2.0.18
    restart: always
    ports:
      - "1883:1883"
    volumes:
      - mosquitto_data:/mosquitto/data

  postgres_auth:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: stadium
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data

  emergency-service:
    build: ./services/Emergency-Service
    restart: always
    depends_on:
      - mosquitto
    environment:
      MAP_SERVICE_URL: http://map-service:8000
      ROUTING_SERVICE_URL: http://routing-service:8002
      MQTT_HOST: mosquitto

  chat-service:
    build: ./services/Chat-Service
    restart: always
    depends_on:
      - postgres_auth
      - mosquitto
    environment:
      DATABASE_URI: postgresql://admin:password@postgres_auth:5432/chat

  event-processor:
    build: ./services/event-processor
    restart: always
    depends_on:
      - mosquitto
    environment:
      MQTT_HOST: mosquitto

  emulator:
    build: ./Emulator-Stadium
    restart: always
    depends_on:
      - mosquitto

volumes:
  mosquitto_data:
  postgres_auth_data: