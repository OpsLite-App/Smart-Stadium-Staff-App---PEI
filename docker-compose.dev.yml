services:
  traefik:
    image: traefik:v3.3
    container_name: traefik-gateway
    depends_on:
      otel-collector:
        condition: service_started
    command:
      - "--entrypoints.web.address=:8080"
      - "--entrypoints.traefik.address=:8088"
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--ping=true"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--tracing.serviceName=traefik-gateway"
      - "--tracing.sampleRate=1.0"
      - "--tracing.otlp.http.endpoint=http://otel-collector:4318/v1/traces"
    ports:
      - "8080:8080"
      - "8088:8088"
    volumes:
      - ./gateway/traefik/dynamic:/etc/traefik/dynamic:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--entrypoints.traefik.address=:8088", "--ping=true"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: redis-cache
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    command: redis-server --appendonly yes

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    container_name: redis-exporter
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_ADDR: redis://redis-cache:6379
    ports:
      - "9121:9121"

  postgres-map-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres-map-exporter
    depends_on:
      postgres_map:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: postgresql://postgres:postgres@postgres_map:5432/estadio_do_dragao?sslmode=disable
    ports:
      - "9187:9187"

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: blackbox-exporter
    command:
      - "--config.file=/etc/blackbox_exporter/config.yml"
    volumes:
      - ./monitoring/prometheus/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    ports:
      - "9115:9115"

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    depends_on:
      - blackbox-exporter
      - redis-exporter
      - postgres-map-exporter
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  tempo:
    image: grafana/tempo:2.6.1
    container_name: tempo
    command:
      - "-config.file=/etc/tempo/config.yml"
    volumes:
      - ./monitoring/tempo/tempo.yml:/etc/tempo/config.yml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"
      - "4317"
      - "4318"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.113.0
    container_name: otel-collector
    command:
      - "--config=/etc/otelcol-contrib/config.yml"
    depends_on:
      - tempo
    volumes:
      - ./monitoring/opentelemetry/collector.yml:/etc/otelcol-contrib/config.yml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"

  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    depends_on:
      - prometheus
      - tempo
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"

  k6:
    image: grafana/k6:2.0.0
    profiles:
      - tools
    depends_on:
      traefik:
        condition: service_healthy
      prometheus:
        condition: service_started
    environment:
      BASE_URL: http://traefik-gateway:8080
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: p(95),p(99),min,max,avg
    volumes:
      - ./monitoring/k6:/scripts:ro
    working_dir: /scripts

  frontend-web:
    build:
      context: ./frontend-web
      dockerfile: Dockerfile
    container_name: frontend-web
    depends_on:
      traefik:
        condition: service_healthy
      auth-service:
        condition: service_started
      routing-service:
        condition: service_started
      congestion-service:
        condition: service_started
      emergency-service:
        condition: service_started
      maintenance-service:
        condition: service_started
      queueing-service:
        condition: service_started
      positioning-service:
        condition: service_started
      chat-service:
        condition: service_started
      ws-gateway:
        condition: service_started
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
      API_GATEWAY_URL: http://traefik-gateway:8080
      AUTH_SERVICE_URL: http://auth-service:8081
      CONGESTION_SERVICE_URL: http://congestion-service:8005
      EMERGENCY_SERVICE_URL: http://emergency-service:8006
      MAINTENANCE_SERVICE_URL: http://maintenance-service:8007
      QUEUEING_SERVICE_URL: http://queueing-service:8003
      ROUTING_SERVICE_URL: http://routing-service:8002
      CHAT_SERVICE_URL: http://chat-service:8000
      POSITIONING_SERVICE_URL: http://positioning-service:8004
      NEXT_PUBLIC_WS_GATEWAY: ws://localhost:8080/ws
    ports:
      - "3000:3000"
    volumes:
      - ./frontend-web:/app
      - frontend_node_modules:/app/node_modules

  mosquitto:
    image: eclipse-mosquitto:2.0.18
    container_name: mosquitto
    ports:
      - "1883:1883"
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -p 1883 -t '$$SYS/broker/uptime' -C 1 -W 2 >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  postgres_auth:
    image: postgres:15-alpine
    container_name: postgres_auth
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: stadium
    ports:
      - "5433:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
      - ./backend/database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d stadium -h localhost"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  postgres_map:
    build:
      context: ./docker/postgres-map
      dockerfile: Dockerfile
    container_name: postgres_map
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: estadio_do_dragao
    ports:
      - "5435:5432"
    volumes:
      - postgres_map_data:/var/lib/postgresql/data
      - ./indoor_gis_backup.sql:/docker-entrypoint-initdb.d-data/indoor_gis_backup.sql:ro
      - ./docker/postgres-map/load-indoor-gis.sh:/docker-entrypoint-initdb.d/20_load_indoor_gis.sh:ro
      - ./docker/postgres-map/21_floor0_camera_coverage.sql:/docker-entrypoint-initdb.d/21_floor0_camera_coverage.sql:ro
      - ./docker/postgres-map/22_camera_status.sql:/docker-entrypoint-initdb.d/22_camera_status.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d estadio_do_dragao -h localhost"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  postgres_chat:
    image: postgres:15-alpine
    container_name: postgres_chat
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: chat
    ports:
      - "5436:5432"
    volumes:
      - postgres_chat_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d chat -h localhost"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  postgres_emergency:
    image: postgres:15-alpine
    container_name: postgres_emergency
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: emergency
    ports:
      - "5438:5432"
    volumes:
      - postgres_emergency_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d emergency -h localhost"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  postgres_maintenance:
    image: postgres:15-alpine
    container_name: postgres_maintenance
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: maintenance
    ports:
      - "5439:5432"
    volumes:
      - postgres_maintenance_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d maintenance -h localhost"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  postgres_keycloak:
    image: postgres:16-alpine
    container_name: postgres_keycloak
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
      POSTGRES_DB: keycloak
    volumes:
      - postgres_keycloak_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak -h localhost"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.1
    container_name: keycloak
    command:
      - start-dev
      - --import-realm
    depends_on:
      postgres_keycloak:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres_keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./identity/keycloak/import:/opt/keycloak/data/import:ro
    ports:
      - "8084:8080"
      - "9000"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf \"GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s


  auth-service:
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    depends_on:
      postgres_auth:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_auth:5432/stadium
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      OPSLITE_SEED_USERS: "true"
      OPSLITE_SEED_USERS_RESET: "true"
      OPSLITE_KEYCLOAK_ENABLED: "true"
      OPSLITE_KEYCLOAK_BASE_URL: http://keycloak:8080
      OPSLITE_KEYCLOAK_REALM: opslite
      OPSLITE_KEYCLOAK_CLIENT_ID: opslite-auth-service
      OPSLITE_KEYCLOAK_CLIENT_SECRET: opslite-dev-secret
    ports:
      - "8081:8081"

  ws-gateway:
    build:
      context: ./ws-gateway
      dockerfile: Dockerfile
    container_name: ws-gateway
    depends_on:
      - mosquitto
      - auth-service
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      mqtt.broker: tcp://mosquitto:1883
      MQTT_HOST: mosquitto
      MQTT_BROKER: tcp://mosquitto:1883
      MQTT_PORT: "1883"
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://otel-collector:4318/v1/traces
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
    ports:
      - "8089:8089"

  map-service:
    profiles: ["legacy"]
    build:
      context: ./services/Map-Service
      dockerfile: Dockerfile
    container_name: map-service
    depends_on:
      postgres_map:
        condition: service_healthy
    environment:
      DATABASE_URI: postgresql://postgres:postgres@postgres_map:5432/estadio_do_dragao
      POSTGRES_USER: postgres
    ports:
      - "8001:8000"

  routing-service:
    build:
      context: ./services
      dockerfile: Routing-Service/Dockerfile
    container_name: routing-service
    depends_on:
      postgres_map:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      DATABASE_URI: postgresql://postgres:postgres@postgres_map:5432/estadio_do_dragao
      PGR_DATABASE_URI: postgresql://postgres:postgres@postgres_map:5432/estadio_do_dragao?options=-csearch_path%3Dindoor,public
      REDIS_URL: redis://redis-cache:6379/0
      REDIS_HOST: redis-cache
      REDIS_PORT: "6379"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_SERVICE_NAME: routing-service
    ports:
      - "8002:8002"

  queueing-service:
    build:
      context: ./services/Queueing-Service
      dockerfile: Dockerfile
    container_name: queueing-service
    depends_on:
      mosquitto:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MQTT_HOST: mosquitto
      MQTT_BROKER: mosquitto
      MQTT_PORT: "1883"
      REDIS_URL: redis://redis-cache:6379/1
      REDIS_HOST: redis-cache
      REDIS_PORT: "6379"
    ports:
      - "8003:8003"

  congestion-service:
    build:
      context: ./services
      dockerfile: Congestion-Service/Dockerfile
    container_name: congestion-service
    depends_on:
      mosquitto:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MQTT_HOST: mosquitto
      MQTT_BROKER: mosquitto
      MQTT_PORT: "1883"
      REDIS_URL: redis://redis-cache:6379/2
      REDIS_HOST: redis-cache
      REDIS_PORT: "6379"
    ports:
      - "8005:8005"

  maintenance-service:
    build:
      context: ./services/Maintenance-Service
      dockerfile: Dockerfile
    container_name: maintenance-service
    depends_on:
      postgres_maintenance:
        condition: service_healthy
      routing-service:
        condition: service_started
      mosquitto:
        condition: service_healthy
    environment:
      ROUTING_SERVICE_URL: http://routing-service:8002
      MQTT_HOST: mosquitto
      MQTT_BROKER: mosquitto
      MQTT_PORT: "1883"
      DATABASE_URL: postgresql://admin:password@postgres_maintenance:5432/maintenance
    ports:
      - "8007:8007"

  emergency-service:
    build:
      context: ./services/Emergency-Service
      dockerfile: Dockerfile
    container_name: emergency-service
    depends_on:
      postgres_emergency:
        condition: service_healthy
      routing-service:
        condition: service_started
      mosquitto:
        condition: service_healthy
      positioning-service:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      ROUTING_SERVICE_URL: http://routing-service:8002
      POSITIONING_SERVICE_URL: http://positioning-service:8004
      MQTT_HOST: mosquitto
      MQTT_BROKER: mosquitto
      MQTT_PORT: "1883"
      DATABASE_URL: postgresql://admin:password@postgres_emergency:5432/emergency
      REDIS_URL: redis://redis-cache:6379/4
      OPERATIONAL_EVENTS_STREAM: opslite:operational-events
      OPERATIONAL_EVENTS_MAXLEN: "5000"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_SERVICE_NAME: emergency-service
    ports:
      - "8006:8006"

  chat-service:
    build:
      context: ./services/Chat-Service
      dockerfile: Dockerfile
    container_name: chat-service
    depends_on:
      postgres_chat:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    environment:
      DATABASE_URI: postgresql://admin:password@postgres_chat:5432/chat
      DB_STARTUP_RETRIES: 30
      DB_STARTUP_RETRY_DELAY: 2
    ports:
      - "8008:8000"


  postgres_positioning:
    image: postgres:15-alpine
    container_name: postgres_positioning
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: positioning
    ports:
      - "5437:5432"
    volumes:
      - postgres_positioning_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d positioning -h localhost"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  positioning-service:
    build:
      context: ./services/Positioning-Service
      dockerfile: Dockerfile
    container_name: positioning-service
    depends_on:
      postgres_positioning:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://admin:password@postgres_positioning:5432/positioning
      REDIS_URL: redis://redis-cache:6379/3
      REDIS_HOST: redis-cache
      REDIS_PORT: "6379"
    ports:
      - "8004:8004"

  event-processor:
    build:
      context: ./services
      dockerfile: event-processor/Dockerfile
    container_name: event-processor
    depends_on:
      - mosquitto
      - routing-service
      - queueing-service
    environment:
      MQTT_HOST: mosquitto
      MQTT_BROKER: mosquitto
      MQTT_PORT: "1883"

  emulator:
    build:
      context: ./Emulator-Stadium
      dockerfile: Dockerfile
    container_name: dragao-emulator
    depends_on:
      - mosquitto
      - routing-service
    environment:
      ROUTING_SERVICE_URL: http://routing-service:8002
      AUTH_SERVICE_URL: http://auth-service:8081
      POSITIONING_SERVICE_URL: http://positioning-service:8004
      MQTT_HOST: mosquitto
      MQTT_BROKER: mosquitto
      MQTT_PORT: "1883"
      PYTHONUNBUFFERED: "1"


volumes:
  prometheus_data:
  tempo_data:
  grafana_data:
  frontend_node_modules:
  redis_data:
  mosquitto_data:
  mosquitto_log:
  postgres_auth_data:
  postgres_keycloak_data:
  postgres_map_data:
  postgres_chat_data:
  postgres_positioning_data:
  postgres_emergency_data:
  postgres_maintenance_data:
