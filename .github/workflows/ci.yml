name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run CI for all Python services
        run: |
          # Install global testing dependencies
          pip install --upgrade pip
          pip install pytest pytest-asyncio httpx paho-mqtt
          
          # Find and process all services containing a requirements.txt file
          find services -name "requirements*.txt" | while read req_file; do
            service_dir=$(dirname "$req_file")
            
            # Skip Integration-Tests as they are handled in a separate job
            if [[ "$service_dir" == *"Integration-Tests"* ]]; then
              echo "Skipping Integration-Tests in unit test job..."
              continue
            fi
            
            echo "Processing service in: $service_dir"
            
            # Install service-specific dependencies
            pip install -r "$req_file"
            
            # Execute tests with PYTHONPATH set to the service directory
            if PYTHONPATH=$service_dir pytest "$service_dir/tests" -v; then
              echo "Tests passed for: $service_dir"
            else
              echo "Tests failed for: $service_dir"
              exit 1
            fi
            
            # Clean up dependencies to avoid environment conflicts
            pip uninstall -y -r "$req_file"
          done

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r services/Integration-Tests/requirements.txt

      - name: Start services with Docker Compose
        run: |
          cd services/Integration-Tests
          docker compose -f docker-compose.test.yml up -d

      - name: Wait for services to be ready
        run: |
          echo "Waiting for services to be healthy..."
          # Give services some time to start and pass healthchecks
          # The docker-compose file already has healthchecks and depends_on conditions
          # but we'll wait a bit more just to be sure the last service is ready
          sleep 30
          docker ps

      - name: Run Integration Tests
        run: |
          cd services/Integration-Tests
          # Set PYTHONPATH to root to allow imports if needed, though pytest usually handles it
          PYTHONPATH=$PYTHONPATH:. pytest . -v

      - name: Stop services
        if: always()
        run: |
          cd services/Integration-Tests
          docker compose -f docker-compose.test.yml down