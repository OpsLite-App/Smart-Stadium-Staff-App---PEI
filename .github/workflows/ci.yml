name: CI Pipeline

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run CI for all Python services
        run: |
          # 1. Instalar ferramentas de teste globalmente para o ambiente
          pip install --upgrade pip
          pip install pytest pytest-asyncio
          
          # 2. Iterar sobre todos os serviços Python
          # Usamos o pipe para garantir que o script não para a meio se um falhar
          find services -name "requirements*.txt" | while read req_file; do
            service_dir=$(dirname "$req_file")
            echo "----------------------------------------------------"
            echo "--- A processar serviço em: $service_dir ---"
            echo "----------------------------------------------------"
            
            # Instala dependências do serviço específico
            pip install -r "$req_file"
            
            # Corre os testes
            # O PYTHONPATH=$service_dir garante que o Python vê os módulos locais
            if PYTHONPATH=$service_dir pytest "$service_dir/tests" -v; then
              echo "✅ Testes passaram em: $service_dir"
            else
              echo "❌ TESTES FALHARAM EM: $service_dir"
              exit 1 # Força a pipeline a falhar se houver erros nos testes
            fi
            
            # Limpeza
            pip uninstall -y -r "$req_file"
          done