name: CI Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run CI for all Python services
        run: |
          # Install global testing dependencies
          pip install --upgrade pip
          pip install pytest pytest-asyncio
          
          # Find and process all services containing a requirements.txt file
          find services -name "requirements*.txt" | while read req_file; do
            service_dir=$(dirname "$req_file")
            echo "Processing service in: $service_dir"
            
            # Install service-specific dependencies
            pip install -r "$req_file"
            
            # Execute tests with PYTHONPATH set to the service directory
            if PYTHONPATH=$service_dir pytest "$service_dir/tests" -v; then
              echo "Tests passed for: $service_dir"
            else
              echo "Tests failed for: $service_dir"
              exit 1
            fi
            
            # Clean up dependencies to avoid environment conflicts
            pip uninstall -y -r "$req_file"
          done