name: CI Pipeline Multi-Service

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip' # Acelera as execuções seguintes

      - name: Install Global CI Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-asyncio httpx

      - name: Run CI for all services
        run: |
          # Procura por todos os ficheiros de requirements no repo
          for req_file in $(find . -name "requirements*.txt"); do
            echo "--- Testing service for $req_file ---"
            
            # 1. Instala dependências específicas do serviço
            pip install -r "$req_file"
            
            # 2. Executa o Linter na pasta desse serviço
            service_dir=$(dirname "$req_file")
            flake8 "$service_dir" --count --select=E9,F63,F7,F82 --show-source --statistics || true
            
            # 3. Executa os testes específicos dessa pasta
            pytest "$service_dir" -v || echo "Aviso: Falha nos testes em $service_dir"
            
            # Limpa para evitar conflitos no próximo serviço do loop
            pip uninstall -y -r "$req_file"
          done