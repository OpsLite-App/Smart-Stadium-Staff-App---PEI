name: Deploy Astro Site

on:
  push:
    branches: [ main ]
    paths:
      - 'microsite/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          # Caminho para o lockfile dentro da subpasta
          cache-dependency-path: './microsite/package-lock.json'

      - name: Install dependencies
        working-directory: ./microsite
        run: npm install

      - name: Build Astro
        working-directory: ./microsite
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Pasta onde o Astro gera o site dentro de microsite
          path: ./microsite/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4